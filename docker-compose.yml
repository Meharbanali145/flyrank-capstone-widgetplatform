services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgetplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgetplatform"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://widget:widget@db:5432/widgetplatform
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: