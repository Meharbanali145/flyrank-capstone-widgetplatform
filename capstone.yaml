# Evaluator manifest — DRAFT. Values marked TODO are confirmed in Phase 2/3.
name: flyrank-capstone-widgetplatform
run: docker compose up --build
seed: docker compose exec app npm run seed
test: docker compose exec app npm test        # optional but recommended
base_url: http://localhost:3000
second_origin_test_page: http://localhost:5500   # TODO confirm in Phase 3

endpoints:
  admin_create_widget:   { method: POST, path: /admin/widgets, auth: bearer }
  embed_snippet:         { method: GET,  path: /admin/widgets/:id/embed, auth: bearer }
  widget_config:         { method: GET,  path: /widgets/:publicId/config }
  widget_bundle_alias:   { method: GET,  path: /widget.js?id=:publicId }
  submit:                { method: POST, path: /submissions }
  dashboard_submissions: { method: GET,  path: /dashboard/submissions, auth: bearer }
  dashboard_stats:       { method: GET,  path: /dashboard/stats/widgets, auth: bearer }

